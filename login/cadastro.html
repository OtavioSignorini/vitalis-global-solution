<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalis - Criar Nova Conta</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="auth-container">
        <div class="auth-header">
            <a href="../index.html" class="logo-link">
                <img src="../img/vitalis-simbolo-azul-escuro.png" alt="Símbolo Vitalis" class="simbolo">
                <img src="../img/vitalis-logo-azul-escuro.png" alt="Logotipo Vitalis" class="logo">
            </a>
            <h2>Criar sua conta</h2>
            <p>Comece a monitorar e proteger quem você ama.</p>
        </div>

        
        <form class="auth-form" id="form-cadastro">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Mínimo de 6 caracteres" required>
            </div>

            <button type="submit" class="btn-auth-primary">Cadastrar Conta</button>
        </form>

        <div class="auth-divider">
            <span>ou</span>
        </div>

        <div class="auth-footer">
            <p>Já possui uma conta?</p>
            <a href="login.html" class="btn-auth-secondary">Fazer Login</a>
        </div>

        <div class="back-home">
            <a href="../index.html">← Voltar para a Landing Page</a>
        </div>
    </main>

    
    <script src="../auth/auth.js"></script>
</body>
</html>
